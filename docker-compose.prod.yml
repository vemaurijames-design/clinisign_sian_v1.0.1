version: '3.8'
# ============================================================
# Configuración de PRODUCCIÓN - Referencia para AWS ECS
# En producción real, usar variables de entorno de ECS Task
# ============================================================

services:
  backend:
    image: ${ECR_REGISTRY}/clinisign-backend:${IMAGE_TAG:-latest}
    container_name: clinisign_backend_prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOST}:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8080:8080"
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/clinisign-backend
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: ecs

  # Nota: En producción, el frontend va en S3 + CloudFront
  # No se despliega como contenedor Docker en ECS
